{% if paginator.previous_page or paginator.next_page %}
  <nav class="pagination" aria-label="Pagination">
    {% assign prev_text = '<i class="fa fa-angle-left" aria-hidden="true"></i>' %}
    {% assign next_text = '<i class="fa fa-angle-right" aria-hidden="true"></i>' %}
    {% include _helper/paginator.html %}
    {{ paginator }}
  </nav>
{% endif %}
